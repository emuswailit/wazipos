# deploy/nginx-websockets.conf — put this inside the `server { ... }` block for
# api.wazipos.co.ke (the 443/SSL one), ABOVE the generic `location /` block:
#
#   sudo nano /etc/nginx/sites-enabled/<your site>
#   sudo nginx -t && sudo systemctl reload nginx
#
# It sends every /ws/ request to Daphne (deploy/wazipos-daphne.service, 127.0.0.1:8001)
# and keeps the connection upgraded and alive. Without the Upgrade / Connection
# headers, or with nothing listening on the port, browsers see
# "can't establish a connection" and nginx logs 502 / 400.

location /ws/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live sockets stay open for hours; Daphne pings every 20 s.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# Also fixes the unstyled admin (Django static files), if not done yet:
location /static/ {
    alias /var/www/wazipos/backend/wazi/staticfiles/;
    access_log off;
    expires 30d;
}
