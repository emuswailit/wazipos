[pytest]
DJANGO_SETTINGS_MODULE = wazi.settings.development
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = tests.py test_*.py *_tests.py

# Only look inside your Django apps for tests
testpaths = retailers/ 

# Ignore these heavy/vendor folders completely
norecursedirs = 
    .git
    my_env
    redis-stable
    node_modules
    staticfiles
    media
    logs

filterwarnings =
    ignore::DeprecationWarning